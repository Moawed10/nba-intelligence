name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      NBA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nba_intelligence_test
      NBA_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install the locked dependency set (hash-checked)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
          pip check
      - name: Lock files match pyproject.toml
        run: |
          pip install uv==0.13.6
          mkdir -p /tmp/lock && sh scripts/lock.sh /tmp/lock
          diff requirements.lock /tmp/lock/requirements.lock
          diff requirements-dev.lock /tmp/lock/requirements-dev.lock
      - run: ruff check app tests
      - run: ruff format --check app tests
      - name: Tests (unit, integration, migrations) with coverage
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contrast
      - name: Generated API types match backend/openapi.json
        run: npm run api:types && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  fullstack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      NBA_FULLSTACK_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nba_intelligence_fullstack
      FULLSTACK_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Install the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real-backend prediction workflow
        working-directory: frontend
        run: npm run test:fullstack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fullstack-failure
          path: |
            frontend/playwright-report-fullstack
            frontend/test-results/fullstack
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python dependencies have no known vulnerabilities
        working-directory: backend
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Production npm dependencies have no high or critical advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: No secrets in the repository history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 detect --source /repo --no-banner

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
      WEB_PORT: "3000"
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - name: Build the API, worker and web images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180 db api web
      - name: Smoke test through the web container
        run: |
          curl -fsS http://localhost:3000/about > /dev/null
          curl -fsS http://localhost:3000/api/v1/health
          curl -fsS http://localhost:3000/api/v1/teams > /dev/null
          docker compose exec -T api python -m app.cli artifacts --help > /dev/null
      - name: The worker stays up and the backup script works
        run: |
          docker compose up -d worker
          docker compose ps --status running worker | grep worker
          docker compose exec -T -e PGPASSWORD=ci-only api sh scripts/backup.sh postgresql://nba@db:5432/nba_intelligence /tmp/backups
      - if: failure()
        run: docker compose logs --no-color --tail 200

